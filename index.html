<link rel="stylesheet" href="assets/css/site.css">
<script>
document.documentElement.classList.add("js");
(function () { // apply the saved light/dark choice before the first paint
  var t = null;
  try { t = localStorage.getItem("rq_theme"); } catch (e) {}
  if (!t) { try { var c = JSON.parse(localStorage.getItem("rq_cache") || "null"); t = c && c.settings && c.settings.theme && c.settings.theme.mode; } catch (e) {} }
  if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
})();
</script>
</head>
