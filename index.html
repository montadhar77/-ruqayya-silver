<body>

<!-- opening: logo-reveal video (uploaded from the dashboard) or animated logo -->
<div class="intro" id="intro">

    <svg class="intro-arch" viewBox="0 0 200 250" id="introArch">
      <path d="M20 250V110A80 80 0 0 1 180 110V250"/>
      <path d="M36 250V114A64 64 0 0 1 164 114V250"/>
      <path d="M100 18l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>

    <img class="intro-logo" id="introLogo" alt="" hidden>
    <div class="intro-name" id="introName">معرض رقية</div>
    <div class="intro-sub" id="introSub"></div>
  </div>
  <button class="intro-skip" id="introSkip" type="button">تخطّي</button>
</div>
<div class="curtain" id="curtain"></div>

<div class="topbar" id="topbar" hidden><div class="track" id="topTrack"></div></div>

<nav class="nav" id="nav" aria-label="القائمة الرئيسية">
  <div class="wrap">
    <div class="nav-links">
      <a href="#/" data-link="home">الرئيسية</a>
      <a href="#/shop" data-link="shop">المتجر</a>

      <span class="brand-txt"><b id="brandName">معرض رقية</b><small id="brandSub">عليها السلام</small></span>
    </a>
    <div class="nav-actions">
      <button class="icon-btn" id="searchBtn" type="button" aria-label="بحث"></button>
      <button class="icon-btn" id="cartBtn" type="button" aria-label="السلة"><span class="badge-count" id="cartCount" hidden>0</span></button>
    </div>
  </div>
</nav>

<main id="app"></main>

<footer class="site" id="footer"></footer>

<!-- mobile menu -->

  <div class="drawer-body"><div class="menu-list" id="menuList"></div></div>
</aside>

<!-- cart -->
<div class="drawer-bg" id="cartBg"></div>

  <div class="drawer-body" id="cartBody"></div>

</aside>

<!-- checkout -->
<div class="modal-bg" id="checkoutBg">

</div>

<!-- search -->

    <div class="search-box">
      <input id="searchInput" type="search" placeholder="ابحث عن خاتم، مسبحة، عطر…" aria-label="بحث في المنتجات" autocomplete="off">
      <button class="icon-btn" type="button" id="searchClose" aria-label="إغلاق البحث"></button>
