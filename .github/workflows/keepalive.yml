# Keeps the live store awake and checks it answers.
# Supabase pauses a Free-plan project after a week with almost no database activity
# (https://supabase.com/docs/guides/platform/free-project-pausing); a paused project means
# no catalogue and no orders. Once a day this reads the public catalogue, exactly as a
# visitor's browser does (public key from assets/js/config.js, nothing secret, nothing written).
# A failed run means the store is down: GitHub e-mails the repository owner.
# Note: GitHub stops scheduled workflows after 60 days without any commit to the repository;
# re-enable it from the Actions tab if that happens.
name: keepalive
on:
  schedule:
    - cron: "41 6 * * *"      # 09:41 Baghdad time
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: assets/js/config.js, sparse-checkout-cone-mode: false }
      - name: Read the live catalogue
        run: |
          url=$(grep -o 'https://[a-z0-9]*\.supabase\.co' assets/js/config.js | head -1)
          key=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' assets/js/config.js | head -1)
          test -n "$url" && test -n "$key"
          for i in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 30 -H "apikey: $key" "$url/rest/v1/rpc/catalog_home?p_limit=1") || code=000
            if [ "$code" = 200 ] && grep -q '"cats"' body.json; then echo "store is up"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 20
          done
          echo "::error::The store's database did not answer. If the Supabase project is paused, open supabase.com/dashboard and press Resume project."
          exit 1
