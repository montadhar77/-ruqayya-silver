# Automated tests on every push / pull request. Uses only local throw-away
# services inside the runner (PostgreSQL, PostgREST, Deno) — never Supabase.
name: tests
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RQ_POSTGREST: ${{ github.workspace }}/.bin/postgrest
      RQ_DENO: deno
      RQ_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16 postgresql-contrib-16 >/dev/null
          mkdir -p .bin && curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ -C .bin
          pip install -q -r tests/requirements.txt
      - name: Database tests (migrations, RLS, checkout, inventory, rate limits)
        run: scripts/test.sh db
      - name: Edge Function tests
        run: scripts/test.sh functions
      - name: End-to-end tests (storefront + dashboard in Chrome)
        run: scripts/test.sh e2e
